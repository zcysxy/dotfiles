# background_opacity 0.7
background_blur 0
hide_window_decorations titlebar-only
dynamic_background_opacity no
window_padding_width 10
tab_bar_style powerline
cursor_shape block
cursor_trail 3

macos_quit_when_last_window_closed yes
# font_family FiraCode Nerd Font Mono
font_size 18

term xterm-256color
shell_integration no-cursor # enabled
allow_remote_control yes
allow_hyperlinks yes
editor nvim
# window_border_width 0.5pt
window_resize_step_cells 2
window_resize_step_lines 2
remember_window_size no
initial_window_width 850
initial_window_height 550
draw_minimal_borders yes
inactive_text_alpha 0.7
# macos_thicken_font 0.5
# active_border_color none
# default layout is vertical splits only
enabled_layouts splits, stack
enable_audio_bell no

macos_option_as_alt yes
map shift+space send_text normal,application \x1b[C
map shift+enter send_text all \x1b[13;2u

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map f6 launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+up layout_action move_to_screen_edge top
map ctrl+shift+left layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

map ctrl+shift+l next_layout

# BEGIN_KITTY_FONTS
font_family      family="FiraCode NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# Nerd Fonts v3.2.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
symbol_map  U+279c  Menlo

map f8 launch --type overlay --title mode sh -c "defaults read -g AppleInterfaceStyle 2>/dev/null && kitty @ set-colors --all --configured ~/.config/kitty/dark.conf || kitty @ set-colors --all --configured ~/.config/kitty/light.conf"
startup_session ./startup.conf
